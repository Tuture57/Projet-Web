security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            access_denied_url: access_denied
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: home
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: home

    access_control:
        # Routes publiques (accessibles sans authentification)
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }

        # Routes réservées aux admins et pilotes
        - { path: ^/entreprises/new, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/entreprises/\d+/edit, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/company/create, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/company/\d+/edit, roles: [ROLE_ADMIN, ROLE_PILOT] }

        # Toutes les autres routes nécessitent une authentification
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10