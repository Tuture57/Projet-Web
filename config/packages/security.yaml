security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            access_denied_url: access_denied
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: home
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: home

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_STUDENT, ROLE_PILOT]
        ROLE_PILOT: [ROLE_USER, ROLE_STUDENT]
        ROLE_STUDENT: [ROLE_USER]

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }

        - { path: ^/entreprises/new, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/entreprises/\d+/edit, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/entreprises/\d+/delete, roles: [ROLE_ADMIN, ROLE_PILOT] }

        - { path: ^/offres/new, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/offres/\d+/edit, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/offres/\d+/delete, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/offres/\d+/toggle, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/offres/\d+/toggle-wishlist, roles: [ROLE_STUDENT] }

        - { path: ^/pilotes/new, roles: [ROLE_ADMIN] }
        - { path: ^/pilotes/\d+/edit, roles: [ROLE_ADMIN] }
        - { path: ^/pilotes/\d+/delete, roles: [ROLE_ADMIN] }

        - { path: ^/etudiants/new, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/etudiants/\d+/edit, roles: [ROLE_ADMIN, ROLE_PILOT] }
        - { path: ^/etudiants/\d+/delete, roles: [ROLE_ADMIN, ROLE_PILOT] }

        - { path: ^/wishlist, roles: [ROLE_ADMIN, ROLE_STUDENT] }
        - { path: ^/candidatures, roles: [ROLE_ADMIN, ROLE_STUDENT] }

        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10