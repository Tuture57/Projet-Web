security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: home
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: home

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS } # Page d’accueil accessible à tous
        - { path: ^/login, roles: PUBLIC_ACCESS } # Page de login accessible à tous
        - { path: ^/logout, roles: PUBLIC_ACCESS } # Page de logout accessible à tous
        - { path: ^/company/create, roles: [ROLE_ADMINISTRATOR, ROLE_PILOT] }
        - { path: ^/company/rate, roles: ROLE_STUDENT }
        # Règles spécifiques pour les routes protégées
        - { path: ^/company, roles: IS_AUTHENTICATED_FULLY } # Protège /company/* mais pas /company/create ou /company/rate (déjà définis)
        - { path: ^/admin, roles: IS_AUTHENTICATED_FULLY } # Protège /admin/*
        # Supprimé : - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10